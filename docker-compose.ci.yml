services:
  backend:
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY for the integration stack}
      SESSION_CONNECTION: pgsql
      DB_CACHE_CONNECTION: pgsql
      DB_CACHE_LOCK_CONNECTION: pgsql
      DB_QUEUE_CONNECTION: pgsql
      QUEUE_CONNECTION: database
      ORDER_CHECKOUT_ENABLED: "true"
  worker:
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY for the integration stack}
      SESSION_CONNECTION: pgsql
      DB_CACHE_CONNECTION: pgsql
      DB_CACHE_LOCK_CONNECTION: pgsql
      DB_QUEUE_CONNECTION: pgsql
      QUEUE_CONNECTION: database
      ORDER_CHECKOUT_ENABLED: "true"
  scheduler:
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY for the integration stack}
      SESSION_CONNECTION: pgsql
      DB_CACHE_CONNECTION: pgsql
      DB_CACHE_LOCK_CONNECTION: pgsql
      ORDER_CHECKOUT_ENABLED: "true"
