name: eoshop

services:
  db:
    image: postgres:17.10-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform_main}
      POSTGRES_USER: ${POSTGRES_USER:-eoshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app

  backend:
    image: ${BACKEND_IMAGE:-eoshop/backend:local}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-platform_main}
      DB_USERNAME: ${POSTGRES_USER:-eoshop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      QUEUE_CONNECTION: database
      DB_QUEUE_CONNECTION: pgsql
      ORDER_CHECKOUT_ENABLED: ${ORDER_CHECKOUT_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - app_storage:/var/www/backend/storage
    networks:
      - app

  worker:
    image: ${BACKEND_IMAGE:-eoshop/backend:local}
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-platform_main}
      DB_USERNAME: ${POSTGRES_USER:-eoshop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      QUEUE_CONNECTION: database
      DB_QUEUE_CONNECTION: pgsql
      DB_QUEUE_RETRY_AFTER: 180
      SESSION_CONNECTION: pgsql
      DB_CACHE_CONNECTION: pgsql
      DB_CACHE_LOCK_CONNECTION: pgsql
      ORDER_CHECKOUT_ENABLED: ${ORDER_CHECKOUT_ENABLED:-false}
    command: ["php", "artisan", "queue:work", "database", "--queue=provisioning", "--sleep=1", "--tries=3", "--timeout=120", "--max-time=3600"]
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    volumes:
      - app_storage:/var/www/backend/storage
    networks:
      - app

  scheduler:
    image: ${BACKEND_IMAGE:-eoshop/backend:local}
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-platform_main}
      DB_USERNAME: ${POSTGRES_USER:-eoshop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      SESSION_CONNECTION: pgsql
      DB_CACHE_CONNECTION: pgsql
      DB_CACHE_LOCK_CONNECTION: pgsql
      ORDER_CHECKOUT_ENABLED: ${ORDER_CHECKOUT_ENABLED:-false}
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    volumes:
      - app_storage:/var/www/backend/storage
    networks:
      - app

  web:
    image: ${WEB_IMAGE:-eoshop/web:local}
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_CENTRAL_DOMAINS: ${VITE_CENTRAL_DOMAINS:-localhost,127.0.0.1,eoshop.local}
        VITE_TENANT_BASE_DOMAIN: ${VITE_TENANT_BASE_DOMAIN:-eoshop.local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  app_storage:
